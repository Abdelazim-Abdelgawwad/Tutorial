title: "easyPARM User Manual"
description: "A comprehensive guide for easyPARM parameterization"
url: "https://abdelazim-abdelgawwad.github.io/Tutorial"  # GitHub Pages URL
baseurl: "/Tutorial"  # Repository name as the base URL

remote_theme: just-the-docs/just-the-docs

# Site logo
#logo: "/Tutorial/logo/easyPARM3.png"

# Site favicon
favicon:  "/Tutorial/logo/easyPARM_icon.jpg" 

# Search configuration
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_fold: false

# Ensure child sections are always visible
defaults:
  -
    scope:
      path: ""
    values:
      nav_fold: false

# Navigation sidebar
nav:
  - title: "Introduction"
    url: "/Tutorial/docs/introduction"
  - title: "Installation"
    url: "/Tutorial/docs/installation"
# Footer content
footer_content: "© 2025 Abdelazim M. A. Abdelgawwad. Distributed under the GNU LESSER GENERAL PUBLIC LICENSE Version 2.1, February 1999."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Author Information
author:
  name: "Abdelazim-Abdelgawwad"
  email: "Abdelazim.abdelgawwad@uv.es"
  affiliation:
    university: "University of Valencia"
    institute: "Institute of Molecular Science"
    group: "QCEXVAL"
    group_url: "https://qcexval.uv.es"

# GitHub Settings
github:
  is_project_page: true
  repository_url: "https://github.com/Abdelazim-Abdelgawwad/Tutorial"
  repository_name: "Tutorial"
  owner_url: "https://github.com/Abdelazim-Abdelgawwad"
  owner_name: "Abdelazim-Abdelgawwad"

# Ensure GitHub Pages detects the site
github_pages:
  is_generated_page: false

ga_tracking: G-7N16T4HJ9F
ga_tracking_anonymize_ip: true  # Optional but recommended 
