# Site Settings
title: "easyPARM Tutorial"
description: "A comprehensive guide for easyPARM parameterization"
url: "https://github.com/Abdelazim-Abdelgawwad/easyPARM.git"
baseurl: "/Tutorial"

# Theme Settings
remote_theme: pages-themes/cayman@v0.2.0
plugins:
- jekyll-remote-theme
markdown: kramdown
show_downloads: false

# Theme Customization
cayman:
  title_font_size: "3.25rem"
  header_padding: "3rem 6rem"
  gradient_start_color: "#155799"
  gradient_end_color: "#159957"
  body_width: "64rem"
  body_font_size: "1.1rem"
  body_line_height: "1.6"
  content_padding: "2rem 6rem"

# Author Information
author:
  name: "Abdelazim-Abdelgawwad"
  email: "Abdelazim.abdelgawwad@uv.es"
  affiliation:
    university: "University of Valencia"
    institute: "Institute of Molecular Science"
    group: "QCEXVAL"
    group_url: "https://qcexval.uv.es"

# GitHub Settings
github:
  is_project_page: true
  repository_url: "https://github.com/Abdelazim-Abdelgawwad/Tutorial"
  repository_name: "Tutorial"
  owner_url: "https://github.com/Abdelazim-Abdelgawwad"
  owner_name: "Abdelazim-Abdelgawwad"

# Remove GitHub Pages attribution
github_pages:
  is_generated_page: false
