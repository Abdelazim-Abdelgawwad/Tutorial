# _config.yml

title: "easyPARM User Manual" 
description: "A comprehensive guide for easyPARM parameterization"
url: "https://github.com/Abdelazim-Abdelgawwad/easyPARM.git"
baseurl: "/Tutorial"
remote_theme: just-the-docs/just-the-docs

sass:
  style: compressed

# Site logo
logo: "/Tutorial/logo/easyPARM3.png"

# Site favicon
#favicon_ico: "/assets/images/favicon.ico"

# Search configuration
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
# Navigation sidebar
nav:
  - title: "Introduction"
    url: "/Tutorial/docs/introduction"
  - title: "Installation"
    url: "/Tutorial/docs/installation"
  - title: "Usage Guide"
    url: "/Tutorial/docs/usage_guide"
  - title: "Appendix"
    url: "/Tutorial/docs/appendix"
  - title: "Troubleshooting"
    url: "/Tutorial/docs/troubleshooting"
  - title: "Tleap Inputs"
    url: "/Tutorial/docs/tleap_inputs"
  - title: "References"
    url: "/Tutorial/docs/references"

# Footer content
footer_content: "© 2025 Abdelazim M. A. Abdelgawwad. Distributed under the GNU LESSER GENERAL PUBLIC LICENSE Version 2.1, February 1999."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Author Information
author:
  name: "Abdelazim-Abdelgawwad"
  email: "Abdelazim.abdelgawwad@uv.es"
  affiliation:
    university: "University of Valencia"
    institute: "Institute of Molecular Science"
    group: "QCEXVAL"
    group_url: "https://qcexval.uv.es"

# GitHub Settings
github:
  is_project_page: true
  repository_url: "https://github.com/Abdelazim-Abdelgawwad/easyPARM.git"
  repository_name: "Tutorial"
  owner_url: "https://github.com/Abdelazim-Abdelgawwad"
  owner_name: "Abdelazim-Abdelgawwad"

# Remove GitHub Pages attribution
github_pages:
  is_generated_page: false
